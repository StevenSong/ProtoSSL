name: Style Check

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  style-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # uv-managed CPython (as in pyproject's [tool.uv]) rather than actions/setup-python,
      # whose prebuilt versions are per runner image and lag new ubuntu-latest releases.
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.7"  # keep in step with envs/install-uv.sh
          python-version: "3.10.19"

      - name: Cache pre-commit envs
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-uv-py3.10.19-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        env:
          SKIP: no-commit-to-branch
        run: uvx --from pre-commit==4.5.1 pre-commit run --all-files  # version from uv.lock
