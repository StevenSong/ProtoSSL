# lightning.pytorch==2.6.0
seed_everything: 42
trainer:
  # limit_train_batches: 2
  # limit_val_batches: 2
  # limit_test_batches: 2
  # limit_predict_batches: 2
  # accumulate_grad_batches: 8 # check batch size
  devices: 1
  precision: 32
  logger:
    class_path: StrictWandbLogger
    init_args:
      project: "ECG-Prototype-Transfer"
      # save_dir: "/opt/gpudata/steven/ecg-prototype-transfer/runs/"
      # name: "resnet50-1d" # check model params
  callbacks:
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: "val_loss"
        mode: "min"
        patience: 10 # check reduce lr on plateau
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: "epoch"
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: "val_loss"
        mode: "min"
        save_last: "link"
    - class_path: PredictionWriter
  max_epochs: 100
  log_every_n_steps: 1
optimizer:
  class_path: torch.optim.AdamW
  init_args:
    lr: 0.001
    weight_decay: 0.01
lr_scheduler:
  class_path: lightning.pytorch.cli.ReduceLROnPlateau
  init_args:
    monitor: "val_loss"
    patience: 3 # check early stopping
model:
  class_path: LitModel
  init_args:
    target_config: "/opt/gpudata/steven/ecg-prototype-transfer/configs/targets.yaml"
    # resnet_type: "resnet50" # check logger params
    # conv_type: "1D" # check logger params
data:
  class_path: LitData
  init_args:
    target_config: "/opt/gpudata/steven/ecg-prototype-transfer/configs/targets.yaml"
    # echonext_data: "/opt/gpudata/ecg/echonext"
    batch_size: 512 # check grad accumulation
    num_workers: 4
