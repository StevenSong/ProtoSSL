program: protossl.protoecgnet_trainer
# name: ProtoECGNet-HEEDB-1D-Global-Coef
# name: ProtoECGNet-HEEDB-2D-Global-Coef
name: ProtoECGNet-HEEDB-2D-Partial-Coef
method: bayes
metric:
  goal: maximize
  name: val_ap
parameters:
  model.lam_clst:
    distribution: log_uniform_values
    min: 0.001
    max: 1.0
  model.lam_sep:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.2
  model.lam_div:
    distribution: log_uniform_values
    min: 10.0
    max: 1000.0
  model.lam_cntrst:
    distribution: log_uniform_values
    min: 1.0
    max: 3000.0
early_terminate:
  # val_ap is configured to log/step at the end of every train epoch
  # this hyperband config gives the step brackets [8, 4, 2]
  # so the prune happens at 2, 4, 8 train epochs
  type: hyperband
  s: 3
  eta: 2
  max_iter: 16
command:
  - ${env}
  - HIGH_MEMORY=1
  - python
  - "-m"
  - ${program}
  - "--pipeline-stage"
  - "learn-prototypes-supervised"
  - "--config"
  # - "../1D-global.yaml"
  # - "../2D-global.yaml"
  - "../2D-partial.yaml"
  - "--trainer.logger.save_dir"
  - "/home/songs1/outputs-tune-heedb"
  - "--data.dataset_path"
  - "/opt/gpudata/ecg/heedb"
  - "--data.data_kwargs"
  - "{\"heedb_split_type\": \"by-label\"}"
  - "--data.num_workers"
  - "8"
  - "--data.prefetch_factor"
  - "4"
  - ${args}
