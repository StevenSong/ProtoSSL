[build-system]
requires = ["hatchling", "hatch-requirements-txt"]
build-backend = "hatchling.build"

[project]
name = "pass_pclr"
authors = [
  { name="Steven Song", email="songs1@uchicago.edu" },
]
description = "Prototype-Attended, Self-Supervision with Patient Contrastive Learning of Representations"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version", "dependencies"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/Steven/ecg-prototype-transfer"
Issues = "https://github.com/Steven/ecg-prototype-transfer/issues"

[tool.hatch.version]
path = "pass_pclr/__init__.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.metadata.hooks.requirements_txt]
files = ["requirements.txt"]
