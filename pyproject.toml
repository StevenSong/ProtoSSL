[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "protossl"
authors = [
  { name="Steven Song", email="songs1@uchicago.edu" },
  { name="Sahil Sethi", email="sethis@uchicago.edu" },
]
description = "ProtoSSL: Self-Supervised Pretraining and Downstream Transfer for Projection-Based Prototype Models"
readme = "README.md"
requires-python = "==3.10.*"
dynamic = ["version"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
# Exact versions are in uv.lock, constrained below to the paper env. requirements.txt and
# env.yaml are the conda/pip record of that env.
dependencies = [
    "cachetools",
    "datasets[audio]==4.0.0",
    "einops",
    "fastdigest",
    "h5py",
    "jsonargparse[signatures]",
    "lightning",
    "matplotlib",
    "matplotlib-venn",
    "numpy>=2.0.0",
    "omegaconf",
    "optuna",
    "optuna-integration",
    "pandas",
    "pqdm",
    "pyarrow",
    "pyyaml",
    "scikit-learn",
    "scipy",
    "seaborn",
    "statsmodels",
    "tensorboard",
    "timm",
    "torch==2.7.0",
    "torchaudio==2.7.0",
    "torchcodec==0.4.0",  # from datasets[audio]; direct so it comes from the cu128 index
    "torchlibrosa",
    "torchmetrics",
    "torchvision==0.22.0",
    "tqdm",
    "wandb",
    "wfdb==4.2.0",
]

[project.urls]
Homepage = "https://github.com/StevenSong/ProtoSSL"
Issues = "https://github.com/StevenSong/ProtoSSL/issues"

[dependency-groups]
dev = ["detect-secrets", "ipykernel", "ipywidgets", "jupyterlab", "pre-commit"]

[tool.hatch.version]
path = "protossl/__init__.py"

[tool.uv]
required-version = "==0.13.7"  # keep in step with envs/install-uv.sh
python-preference = "only-managed"  # same uv-built CPython on every node, never conda/system
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64' and implementation_name == 'cpython'",
]
# Every locked package pinned to its version in the paper env (conda env `protossl`,
# py3.10.19, torch 2.7.0+cu128). Regenerate from that env's `pip freeze`.
